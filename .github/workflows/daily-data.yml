name: Daily market data

on:
  schedule:
    - cron: "30 13 * * 1-5"  # 19:00 IST on weekdays: NSE prices, scores, filings, alerts
    - cron: "45 17 * * *"    # 23:15 IST every day: mutual fund NAVs
  workflow_dispatch: {}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load today's data into the database
        run: python -m matrix.pipeline --days 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
