services:
  - type: web
    name: matrix-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn matrix.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: MATRIX_OWNER
        sync: false
      - key: MATRIX_SECRET
        generateValue: true
      - key: MATRIX_SIGNUP
        value: "1"
      - key: MATRIX_SECURE_COOKIE
        value: "1"
      - key: MATRIX_TRUST_PROXY
        value: "1"
      - key: MATRIX_SCHEDULER
        value: "0"
